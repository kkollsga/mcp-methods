[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mcp-methods"
description = "Reusable utility methods for MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Kristian Kollsgard" }
]
keywords = [
    "mcp",
    "ai",
    "agent",
    "github",
    "tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

# `pip install mcp-methods` → `mcp-server` on PATH. The entry point
# resolves to a Python launcher (`mcp_methods._cli:main`) which execs
# the native Rust binary bundled under `mcp_methods/_bin/mcp-server`.
# The native binary is built by maturin alongside the cdylib (the
# `[[bin]]` target in Cargo.toml); the wheel-build workflow copies it
# into the package's `_bin/` directory before maturin packages the
# Python tree.
[project.scripts]
mcp-server = "mcp_methods._cli:main"

[project.urls]
Homepage = "https://github.com/kkollsga/mcp-methods"
Repository = "https://github.com/kkollsga/mcp-methods"
Issues = "https://github.com/kkollsga/mcp-methods/issues"

[tool.maturin]
# `python-extension` enables `python` + `pyo3/extension-module` for the
# cdylib build path. `server` is enabled too so the binary is built
# (and so the python.rs / embedder.rs modules are visible to the
# cdylib for Python-facing tool loading).
features = ["python-extension", "server"]
python-source = "python"
module-name = "mcp_methods._mcp_methods"

# Force-include the bundled `mcp-server` binary into the wheel. It
# lives under `python/mcp_methods/_bin/` after the `make bundle-bin`
# step (or the equivalent CI workflow step) runs. The binary is
# `.gitignore`d (would pollute git with platform-specific outputs),
# and maturin would skip ignored files by default — this override
# tells it the file is part of the wheel. POSIX builds package
# `mcp-server`; Windows builds package `mcp-server.exe`. Only one of
# the two exists on any given platform, but listing both keeps the
# config platform-agnostic.
include = [
    { path = "python/mcp_methods/_bin/mcp-server", format = "wheel" },
    { path = "python/mcp_methods/_bin/mcp-server.exe", format = "wheel" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=mcp_methods"
