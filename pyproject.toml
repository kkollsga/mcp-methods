[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mcp-methods"
description = "Reusable utility methods for MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Kristian Kollsgard" }
]
keywords = [
    "mcp",
    "ai",
    "agent",
    "github",
    "tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/kkollsga/mcp-methods"
Repository = "https://github.com/kkollsga/mcp-methods"
Issues = "https://github.com/kkollsga/mcp-methods/issues"

# `pip install mcp-methods` puts `mcp-server` on PATH via the Python
# launcher at `mcp_methods._cli:main`, which execs the bundled native
# Rust binary at `mcp_methods/_bin/mcp-server`. The binary is built
# separately from `crates/mcp-server` (zero libpython link), copied
# into the package by the wheel-build workflow before maturin packages
# the Python tree, and force-included by the `[tool.maturin] include`
# block below.
[project.scripts]
mcp-server = "mcp_methods._cli:main"

[tool.maturin]
# Wheel is built from the binding crate (`crates/mcp-methods-py`)
# which depends on the pure-Rust library and adds the PyO3 wrappers.
# The cdylib lands at `mcp_methods/_mcp_methods.so` inside the wheel
# (per `module-name`), the same path Python's `__init__.py` imports
# from. Pyo3's `abi3-py310` feature collapses the per-Python-version
# wheel matrix to a single abi3 wheel per OS.
manifest-path = "crates/mcp-methods-py/Cargo.toml"
python-source = "python"
module-name = "mcp_methods._mcp_methods"
# Force-include the bundled `mcp-server` binary into the wheel. It
# lives under `python/mcp_methods/_bin/` after the wheel-build
# workflow's pre-maturin step runs `cargo build -p mcp-server
# --release` and copies the result into the package. `_bin/` is in
# `.gitignore` so the binary doesn't get committed, and maturin would
# skip ignored files by default — this override tells it the file is
# part of the wheel. POSIX builds package `mcp-server`; Windows
# builds package `mcp-server.exe`. Only one of the two paths exists
# on any given build; maturin silently skips missing entries.
include = [
    { path = "python/mcp_methods/_bin/mcp-server", format = "wheel" },
    { path = "python/mcp_methods/_bin/mcp-server.exe", format = "wheel" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=mcp_methods"
