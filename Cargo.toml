[workspace]
members = [".", "crates/mcp-server"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Kristian Kollsgard"]
license = "MIT"

[package]
name = "mcp-methods"
version = "0.3.20"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Reusable utility methods for MCP servers — Rust core"

[lib]
name = "_mcp_methods"
crate-type = ["cdylib", "rlib"]

# `python-extension` toggles pyo3's extension-module feature. Activated
# by maturin when building the wheel (see pyproject.toml). Off by
# default so the rlib can be linked into a normal Rust binary that
# embeds CPython itself.
[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.28.2"
regex = "1"
fancy-regex = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# ripgrep crates
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
