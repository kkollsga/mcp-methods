[package]
name = "mcp-methods"
version = "0.2.1"
edition = "2021"
authors = ["Kristian Kollsgard"]
description = "Reusable utility methods for MCP servers — Rust core"
license = "MIT"

[lib]
name = "_mcp_methods"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28.2"
regex = "1"
fancy-regex = "0.17"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# ripgrep crates
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
