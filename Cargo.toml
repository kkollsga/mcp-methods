[workspace]
members = [
    "crates/mcp-methods",
    "crates/mcp-methods-py",
    "crates/mcp-server",
]
# Example downstream crates are self-contained and consume
# `mcp-methods` from crates.io — keep them out of the workspace so
# they exercise the *external-consumer* dep path.
exclude = ["examples/downstream_binary"]
resolver = "2"

[workspace.package]
# Single source of truth for the release version. All crates inherit via
# `version.workspace = true`; a release is one edit here. The mcp-server →
# mcp-methods dep pin is a minor-level req so patch bumps never touch
# it.
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
authors = ["Kristian Kollsgard"]
license = "MIT"

# Dependency debug info: line-tables-only (kglite's measured recipe, 2026-08-31 compile-footprint
# review: rlib -43%, debug tree ~-22%). Workspace crates keep full debug info; dependency
# backtraces keep file/line.
[profile.dev.package."*"]
debug = "line-tables-only"
