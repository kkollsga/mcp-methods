[package]
name = "mcp-server"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust-native MCP server framework + binary, built on rmcp + mcp-methods primitives"

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
# Sibling crate: re-uses mcp-methods's pure-Rust internals (github API,
# discussion compaction, ElementCache). The PyO3 layer is in the cdylib;
# we depend on the rlib output here.
mcp-methods = { path = "../.." }

# MCP protocol
rmcp = { version = "1.6", features = ["server", "macros", "transport-io", "schemars"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "time"] }

# Manifest parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"

# Error handling + CLI
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Source-tool primitives: ripgrep crates + parallel walker
regex = "1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

# Python extension layer — load manifest-declared `python:` tool hooks
# and custom embedder factories. `auto-initialize` embeds CPython into
# the binary so users only need their tool code on disk.
pyo3 = { version = "0.28", features = ["auto-initialize"] }

# Watch-mode file watcher (debounced).
notify = "8"
notify-debouncer-mini = "0.6"

[dev-dependencies]
tempfile = "3"
