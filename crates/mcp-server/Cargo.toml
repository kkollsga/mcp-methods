[package]
name = "mcp-server"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust-native MCP server framework + binary, built on rmcp + mcp-methods primitives"

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
# MCP protocol
rmcp = { version = "1.6", features = ["server", "macros", "transport-io", "schemars"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "time"] }

# Manifest parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"

# Error handling + CLI
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
