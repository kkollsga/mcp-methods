[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generic Rust-native MCP server CLI — built on the mcp-methods framework"
repository = "https://github.com/kkollsga/mcp-methods"
homepage = "https://github.com/kkollsga/mcp-methods"
readme = "../../README.md"
keywords = ["mcp", "cli", "ai", "rmcp", "agent"]
categories = ["command-line-utilities", "development-tools"]
# The `mcp-server` name on crates.io is owned by a different team
# (Anthropic squatted it at 0.1.0). Our binary ships via the Python
# wheel and via `cargo install --git`; the README documents both
# paths under "Not on crates.io — unpublished on purpose."
publish = false

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
mcp-methods = { version = "0.4", path = "../mcp-methods", features = ["server"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test-only. `publish = false` on this crate, so this has no release
# surface at all; it builds the on-disk manifest layouts the
# `local_workspace_mode` path resolution is asserted against.
[dev-dependencies]
tempfile = "3"
