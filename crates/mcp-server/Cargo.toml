[package]
name = "mcp-server"
version = "0.3.32"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generic Rust-native MCP server CLI — built on the mcp-methods framework"
repository = "https://github.com/kkollsga/mcp-methods"
homepage = "https://github.com/kkollsga/mcp-methods"
readme = "../../README.md"
keywords = ["mcp", "cli", "ai", "rmcp", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
mcp-methods = { version = "0.3.32", path = "../mcp-methods", features = ["server"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
