[package]
name = "mcp-methods-py"
version = "0.3.43"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PyO3 bindings for mcp-methods — builds the Python wheel's cdylib"
publish = false  # consumed only by maturin; not on crates.io

[lib]
name = "_mcp_methods"
crate-type = ["cdylib"]

[dependencies]
# Pulls in the `server` feature so the pyo3 layer can wrap the
# manifest parser and skills registry. The `mcp-methods` crate itself
# stays pyo3-free (CI gate: `cargo tree -p mcp-methods -e all | grep
# pyo3` returns empty); the heavier server-side deps (rmcp, tokio)
# compile in here but are largely dead-code-eliminated since the
# Python wrappers don't call into them.
mcp-methods = { path = "../mcp-methods", default-features = false, features = ["server"] }
# `auto-initialize` for the rare case the cdylib is embedded somewhere
# without a Python parent; `extension-module` for the wheel build path
# (Python loads the .so, libpython stays unlinked). `abi3-py310`
# collapses the per-Python-version wheel matrix into a single abi3
# wheel per OS.
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
