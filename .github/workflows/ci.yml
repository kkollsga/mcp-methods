name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace -- -D warnings
      # Workspace-wide build covers all three crates (mcp-methods,
      # mcp-methods-py, mcp-server). mcp-methods-py is a cdylib that
      # only links cleanly inside maturin, so we skip cargo-direct test
      # for it and let the wheel-build job exercise that path.
      - run: cargo build -p mcp-methods -p mcp-server
      - run: cargo test -p mcp-methods
      - run: cargo test -p mcp-server
      # Verify the pure-Rust library has zero pyo3 in its dep tree.
      # If pyo3 ever leaks back in (e.g. via a transitive dep), this
      # fails fast.
      - name: Verify no pyo3 in mcp-methods dep tree
        run: |
          if cargo tree -p mcp-methods -e all | grep -q pyo3; then
            echo "FAIL: pyo3 leaked into mcp-methods deps:"
            cargo tree -p mcp-methods -e all | grep pyo3
            exit 1
          fi
          echo "OK: no pyo3 in mcp-methods deps"

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned: an unpinned formatter turns every upstream ruff release into a
      # red build on an unrelated commit. 0.16.0 formats Python inside Markdown
      # code blocks, which 0.15.x did not — that shift broke CI here on a
      # commit that touched only pyproject.toml.
      - run: pip install ruff==0.16.0
      - run: ruff format --check .
      - run: ruff check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-cov requests
          maturin develop --release
          pytest tests/ -v
      - name: Test import
        run: |
          source .venv/bin/activate
          python -c "from mcp_methods import github_discussions, git_api, ripgrep_files, read_file, list_dir, ElementCache; print('Import successful')"
