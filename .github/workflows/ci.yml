name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      # Default build (python + server features both on) — covers the
      # standard `cargo install` path and the wheel build path.
      - run: cargo build
      - run: cargo test
      # Pure-Rust primitives — no pyo3, no rmcp, no tokio. Downstream
      # consumers that want only the cache/github/git_refs/compact/html
      # subset must continue to build cleanly. This is what guards
      # kglite's pyo3-free path against future pyo3 leaks.
      - run: cargo build --no-default-features
      - run: cargo test --no-default-features
      # Pure-Rust server (no python, with rmcp framework) — the binary
      # downstream consumers ship in their own wheel without libpython
      # linkage. Verifies the cfg gating across both axes.
      - run: cargo build --no-default-features --features server
      - run: cargo test --no-default-features --features server

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-cov requests
          maturin develop --release
          pytest tests/ -v
      - name: Test import
        run: |
          source .venv/bin/activate
          python -c "from mcp_methods import github_discussions, git_api, ripgrep_files, read_file, list_dir, ElementCache; print('Import successful')"
