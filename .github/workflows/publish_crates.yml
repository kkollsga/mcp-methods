name: Publish to crates.io
on:
  push:
    paths:
      # Version is single-sourced in the root [workspace.package].version.
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_publish: ${{ steps.check_crates_io.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          # Single source of truth: [workspace.package].version in root Cargo.toml.
          VERSION=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"
      - name: Check if version exists on crates.io
        id: check_crates_io
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # crates.io rate-limits / blocks default GitHub-runner User-Agents
          # on the per-version endpoint (returns 403 instead of 200/404). Use
          # the per-crate endpoint with an explicit UA and pull the version
          # list — this is the same source the cargo client reads.
          VERSIONS=$(curl -fsSL -A "mcp-methods-ci (kkollsga/mcp-methods)" \
            "https://crates.io/api/v1/crates/mcp-methods" \
            | jq -r '.versions[].num')
          if echo "$VERSIONS" | grep -qx "$VERSION"; then
            echo "Version $VERSION already on crates.io"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not on crates.io"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          # Mirrors the wheel-build gate exactly so both publish flows
          # block on the same set of green checks.
          check-regexp: ^(Rust checks|Python checks|Tests)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  publish:
    name: cargo publish mcp-methods
    needs: [version, ci-gate]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # mcp-server has `publish = false` (the name is squatted on
      # crates.io by another team); the wheel build/cargo install
      # paths are the only distribution channels for the binary.
      # mcp-methods-py has `publish = false` (cdylib, consumed only
      # by maturin). So this workflow only publishes one crate.
      #
      # The `already exists` branch is the idempotency belt — the
      # version-check job is the suspenders. If a race or a stale
      # cache lets a re-run reach this step after a successful
      # publish, we treat it as a no-op rather than a failure.
      - name: cargo publish -p mcp-methods
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          OUTPUT=$(cargo publish -p mcp-methods 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -q "already exists on crates.io"; then
            echo "::notice::Version already on crates.io; treating as no-op."
            exit 0
          fi
          exit $STATUS
