name: Publish to crates.io
on:
  push:
    paths:
      - 'crates/mcp-methods/Cargo.toml'
  workflow_dispatch:

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_publish: ${{ steps.check_crates_io.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m 1 "version" crates/mcp-methods/Cargo.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"
      - name: Check if version exists on crates.io
        id: check_crates_io
        run: |
          # crates.io API returns 404 for missing versions, 200 for present ones.
          # We hit the version-specific endpoint so a partial-publish (crate exists
          # but this version doesn't yet) still gets a 404 and triggers a publish.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/mcp-methods/${{ steps.get_version.outputs.version }}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${{ steps.get_version.outputs.version }} already on crates.io"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.get_version.outputs.version }} not on crates.io (HTTP $HTTP_STATUS)"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          # Mirrors the wheel-build gate exactly so both publish flows
          # block on the same set of green checks.
          check-regexp: ^(Rust checks|Python checks|Tests)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  publish:
    name: cargo publish mcp-methods
    needs: [version, ci-gate]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # mcp-server has `publish = false` (the name is squatted on
      # crates.io by another team); the wheel build/cargo install
      # paths are the only distribution channels for the binary.
      # mcp-methods-py has `publish = false` (cdylib, consumed only
      # by maturin). So this workflow only publishes one crate.
      - name: cargo publish -p mcp-methods
        run: cargo publish -p mcp-methods --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
