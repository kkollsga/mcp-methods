name: Publish to crates.io
on:
  push:
    # Release-only ref. `ci.yml` runs on push to `main` (and on PRs), so a
    # feature-branch push finds no matching checks and `ci-gate` waits on
    # something that never appears — with the broadened paths below that
    # would be every `.rs` push. It also matches the documented intent:
    # the bump must only land on the ref you intend to release from.
    # `workflow_dispatch` stays unrestricted, so a manual re-run from any
    # ref is still possible.
    branches: [main]
    paths:
      # Version is single-sourced in the root [workspace.package].version.
      - 'Cargo.toml'
      # Broadened 2026-08-31: a `Cargo.toml`-only trigger meant a version
      # bump that failed CI and was then fixed by a commit touching only
      # `.rs`/`.py` re-ran CI but *not* this workflow, leaving the version
      # silently unpublished until someone fired workflow_dispatch by hand.
      # Re-runs are idempotent: every publishing job is gated on
      # `needs.version.outputs.should_publish`, so a push at an
      # already-live version is a complete no-op.
      - 'crates/**'
      - 'python/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_publish: ${{ steps.check_crates_io.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          set -euo pipefail
          # Single source of truth: [workspace.package].version in root Cargo.toml.
          # `cut` is last in the pipeline, so its exit status (always 0) is the
          # step's — a grep that matches nothing yields an empty VERSION and a
          # green run that publishes nothing. Assert well-formedness here,
          # before the value can reach $GITHUB_OUTPUT and drive should_publish.
          VERSION=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2) || VERSION=''
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::could not read a semver version from the root Cargo.toml (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
      - name: Check if version exists on crates.io
        id: check_crates_io
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          # crates.io rate-limits / blocks default GitHub-runner User-Agents
          # on the per-version endpoint (returns 403 instead of 200/404). Use
          # the per-crate endpoint with an explicit UA and pull the version
          # list — this is the same source the cargo client reads.
          #
          # The publish decision must rest on an answer we actually got. This
          # pipeline used to end in `jq`, so it reported jq's status: a 403,
          # a 5xx or a dropped connection left VERSIONS empty, the membership
          # test missed, and should_publish became `true` on no evidence at
          # all — a gate that cannot fail, on an irreversible path. Capture
          # the HTTP status explicitly and fail loudly instead. Recovery is a
          # `workflow_dispatch` re-run once the outage clears, which
          # should_publish already makes safe at any time.
          STATUS=$(curl -sS -A "mcp-methods-ci (kkollsga/mcp-methods)" \
            -o response.json -w '%{http_code}' \
            "https://crates.io/api/v1/crates/mcp-methods") || STATUS=000
          if [ "$STATUS" != "200" ]; then
            echo "::error::crates.io did not answer for mcp-methods (HTTP $STATUS, 000 = curl/network failure); refusing to guess the publish state"
            head -c 500 response.json || true
            exit 1
          fi
          if ! jq -e 'has("versions") and (.versions | type == "array")' response.json >/dev/null 2>&1; then
            echo "::error::crates.io answered 200 for mcp-methods but the body has no .versions array"
            head -c 500 response.json || true
            exit 1
          fi
          VERSIONS=$(jq -r '.versions[].num' response.json)
          if printf '%s\n' "$VERSIONS" | grep -qx "$VERSION"; then
            echo "Version $VERSION already on crates.io"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not on crates.io"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          # Mirrors the wheel-build gate exactly so both publish flows
          # block on the same set of green checks.
          check-regexp: ^(Rust checks|Rust 1.88 MSRV|Python checks|Tests)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  publish:
    name: cargo publish mcp-methods
    needs: [version, ci-gate]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # mcp-server has `publish = false` (the name is squatted on
      # crates.io by another team); the wheel build/cargo install
      # paths are the only distribution channels for the binary.
      # mcp-methods-py has `publish = false` (cdylib, consumed only
      # by maturin). So this workflow only publishes one crate.
      #
      # The `already exists` branch is the idempotency belt — the
      # version-check job is the suspenders. If a race or a stale
      # cache lets a re-run reach this step after a successful
      # publish, we treat it as a no-op rather than a failure.
      - name: cargo publish -p mcp-methods
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          OUTPUT=$(cargo publish -p mcp-methods 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -q "already exists on crates.io"; then
            echo "::notice::Version already on crates.io; treating as no-op."
            exit 0
          fi
          exit $STATUS
