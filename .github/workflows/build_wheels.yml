name: Build and Publish Python Wheels
on:
  push:
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_publish: ${{ steps.check_pypi.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m 1 "version" Cargo.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"
      - name: Check if version exists on PyPI
        id: check_pypi
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/mcp-methods/${{ steps.get_version.outputs.version }}/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${{ steps.get_version.outputs.version }} already on PyPI"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.get_version.outputs.version }} not on PyPI"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          check-regexp: ^(Rust checks|Python checks|Tests)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  build:
    name: Build wheels on ${{ matrix.os }}
    needs: [version, ci-gate]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: '3.10'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: '3.11'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: '3.12'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: '3.13'
          - os: macos-latest
            target: aarch64-apple-darwin
            python-version: '3.10'
          - os: macos-latest
            target: aarch64-apple-darwin
            python-version: '3.11'
          - os: macos-latest
            target: aarch64-apple-darwin
            python-version: '3.12'
          - os: macos-latest
            target: aarch64-apple-darwin
            python-version: '3.13'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: '3.10'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: '3.11'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: '3.12'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pip install maturin
      # Build the bundled `mcp-server` binary first and copy it into
      # the python package's `_bin/` directory. Maturin's `include`
      # config (in pyproject.toml) then force-packages the binary into
      # the wheel — without this step the wheel ships with an
      # unresolvable `[project.scripts]` entry point that points at a
      # missing file.
      - name: Build + bundle mcp-server binary
        run: |
          cargo build --release --target ${{ matrix.target }} --features server --bin mcp-server
          if (!(Test-Path -Path "python/mcp_methods/_bin")) { New-Item -ItemType Directory -Path "python/mcp_methods/_bin" -Force }
          if ($IsWindows) {
            Copy-Item "target/${{ matrix.target }}/release/mcp-server.exe" "python/mcp_methods/_bin/mcp-server.exe"
          } else {
            Copy-Item "target/${{ matrix.target }}/release/mcp-server" "python/mcp_methods/_bin/mcp-server"
          }
        shell: pwsh
      - name: Build wheels
        run: |
          if (!(Test-Path -Path "wheels")) { New-Item -ItemType Directory -Path "wheels" }
          maturin build --release --target ${{ matrix.target }} --out wheels
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheels/*.whl

  publish:
    name: Publish to PyPI
    needs: [version, build]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
